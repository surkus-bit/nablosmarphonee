<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#142B45">
<meta name="description" content="Katalog HP bekas berkualitas, lengkap dengan spesifikasi dan hasil QC.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NABLO">
<meta name="format-detection" content="telephone=no">
<title>NABLO SMARTPHONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style id="nablo-ui">
/* NABLO SMARTPHONE · UI v4 — satu stylesheet, palet navy/biru, tanpa lapisan tema lama */
:root{
  --navy:#142B45;--blue:#245B86;--blue-d:#1C4A6C;--blue-l:#E8F0F7;
  --bg:#F5F7FA;--card:#FFFFFF;--t:#1E293B;--mut:#64748B;--line:#E2E8F0;
  --ok:#15803D;--ok-l:#DCFCE7;--warn:#B45309;--warn-l:#FEF3C7;--bad:#DC2626;--bad-l:#FEE2E2;
  --n:#245B86;--n2:#1C4A6C;--dk:#142B45;--g:#245B86;--gold:#142B45;
  --r:12px;--r-s:8px;--sh:0 1px 2px rgba(20,43,69,.06);--sbw:252px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;font-family:var(--font);-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:clip}
body{background:var(--bg);color:var(--t);min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{width:100%;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#app.noav{padding-bottom:0}
.pg{padding:16px 14px;max-width:1200px;margin-inline:auto;animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Header ---------- */
.hd{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;min-height:56px}
.hd b{flex:1;font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
.hd img{border-radius:8px!important;box-shadow:none!important;background:#fff}
.bk,.ic{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:17px;cursor:pointer;width:36px;height:36px;border-radius:var(--r-s);flex:none;display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.bk:hover,.ic:hover{background:rgba(255,255,255,.18)}
.hd .btn{margin:0}

/* ---------- Kartu & grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card>b:first-child{display:block;margin-bottom:10px;font-size:14px;font-weight:700;color:var(--navy)}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.ct b{font-size:14px;font-weight:700;color:var(--navy)}.ct small{color:var(--mut);font-size:12px}
.sec{font-size:13px;font-weight:700;color:var(--navy);margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}.tile.s{text-align:center}
.tile b{display:block;font-size:19px;color:var(--navy);line-height:1.15}.tile small{font-size:12px;color:var(--mut)}
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px}
.hero .who{display:flex;align-items:center;gap:12px}
.hero .who small{display:block;opacity:.75;font-size:12px}.hero .who b{font-size:15px;display:block}
.hero .big{margin-top:16px}.hero .big small{opacity:.8;font-size:12px}
.hero .big b{display:block;font-size:clamp(26px,2vw + 18px,34px);font-weight:700;letter-spacing:-.6px;margin:2px 0}
.av{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:14px}
.qa div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--t);transition:border-color .15s,background .15s}
.qa div:hover{border-color:var(--blue);background:var(--blue-l)}.qa div:active{background:var(--blue-l)}
.qa i,.stat-icon,.trust i{display:flex;width:38px;height:38px;margin:0 auto 6px;border-radius:10px;background:var(--blue-l);color:var(--blue);align-items:center;justify-content:center;font-style:normal;font-size:18px}
.qa i svg,.dg i svg,nav i svg,.sb-it i svg,.stat-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.pt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.pt:hover{border-color:var(--blue)}
.pt i{position:absolute;right:10px;top:12px;width:8px;height:8px;border-radius:50%}
.pt:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--c,#CBD5E1)}
.pt b{display:block;font-size:24px;color:var(--navy);line-height:1.1}.pt small{font-size:12px;color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px;margin-bottom:14px}
.kpi .k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpi .k.w{background:var(--blue);border-color:var(--blue);color:#fff;cursor:pointer}.kpi .k.w small{color:rgba(255,255,255,.85)}.kpi .k.w b{color:#fff}
.kpi small{font-size:12px;color:var(--mut);display:block}.kpi b{font-size:18px;color:var(--navy);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px;margin-bottom:12px}
.sm .k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sm .k small{font-size:12px;color:var(--mut);display:block}.sm .k b{font-size:16px;color:var(--navy);display:block;margin-top:2px}.sm .k em{font-style:normal;font-size:12px;font-weight:700;color:var(--ok)}
.sm .k.a{background:var(--blue);border-color:var(--blue);color:#fff}.sm .k.a small,.sm .k.a em{color:rgba(255,255,255,.85)}.sm .k.a b{color:#fff}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
.top li{list-style:none;display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.top li:last-child{border:0}
.stamp{border:2px solid var(--ok);color:var(--ok);font-weight:800;padding:4px 12px;border-radius:6px;transform:rotate(-8deg);display:inline-block}

/* ---------- Form ---------- */
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px;font-size:14px;background:#fff;outline:none;color:var(--t);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,91,134,.14)}
input.err{border-color:var(--bad);background:#FEF2F2}
input[type=checkbox],input[type=radio]{width:auto;margin:0;accent-color:var(--blue)}
label{font-size:12px;font-weight:600;color:var(--t);display:block}
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);padding:10px 15px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px;margin:3px 3px 3px 0;transition:background .15s,opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--blue-d)}.btn:active{background:var(--navy)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.w{width:100%;padding:13px;font-size:15px;display:flex;margin:8px 0}
.btn.g{background:var(--blue);border-color:var(--blue)}
.btn.l{background:#fff;color:var(--blue);border-color:var(--line)}.btn.l:hover{background:var(--blue-l);border-color:var(--blue)}
.btn.r{background:var(--bad);border-color:var(--bad)}.btn.r:hover{background:#B91C1C}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid var(--line);color:var(--t);transition:.15s}
.chip:hover{border-color:var(--blue)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sw{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}.sw:last-child{border:0}.sw span{flex:1;font-size:13px;min-width:0}.sw small{color:var(--mut)}
.sw[onclick]{cursor:pointer}.sw[onclick]:hover{background:#F8FAFC}
.sw input[type=checkbox]{width:40px;height:22px}
.up{display:flex;gap:12px;align-items:center;margin:6px 0 12px}
.upv{width:84px;height:112px;border-radius:10px;background:#F1F5F9;border:1px dashed #CBD5E1;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex:none}
.upv img{width:100%;height:100%;object-fit:cover}.upv.c{width:112px}.upv.c img{object-fit:contain;background:#fff}
.upb{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}.upb .btn{margin:0}.upb small{color:var(--mut);font-size:12px}
.flt-d{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin:0 0 12px}
.flt-d label{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0}
.flt-d input[type=date]{margin:0;padding:10px;min-width:0;width:100%}.flt-d .btn{padding:10px 14px;white-space:nowrap;margin:0}
.stk-f{margin-bottom:12px}.stk-s{margin-bottom:10px}.stk-s input{margin:0}
.stk-c{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stk-c .chip{display:inline-flex;align-items:center;gap:8px}
.stk-c .chip em{font-style:normal;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--line);text-align:center}
.stk-c .chip.on em{background:rgba(255,255,255,.25)}
.stk-n{font-size:12px;color:var(--mut);padding:0 2px}
#ls .card.item{content-visibility:auto;contain-intrinsic-size:auto 140px}

/* ---------- Item / badge / tabel ---------- */
.item{display:flex;gap:12px;align-items:flex-start}
.item .ph{width:72px;height:96px;border-radius:10px;background:#E2E8F0;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;cursor:zoom-in;color:var(--mut)}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .in{flex:1;font-size:12.5px;color:var(--mut);min-width:0;line-height:1.55}.item h4{font-size:14px;color:var(--navy);margin-bottom:2px;letter-spacing:-.1px}
.bd{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;float:right;color:#fff;white-space:nowrap}
.b-gray{background:#F1F5F9;color:#475569}.b-or{background:var(--warn-l);color:var(--warn)}.b-bl{background:var(--blue-l);color:var(--blue)}
.b-red{background:var(--bad-l);color:#B91C1C}.b-gr{background:var(--ok-l);color:var(--ok)}.b-gold{background:#E2E8F0;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#F1F5F9;color:#475569;padding:10px;text-align:left;font-weight:700;font-size:12px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}
#app .card:has(table){overflow-x:auto;-webkit-overflow-scrolling:touch}#app table{min-width:100%}
.fin-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px}.fin-row:last-child{border:0}
.fin-row span{flex:1;min-width:0}.fin-row small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.4}
.fin-row b{white-space:nowrap;font-variant-numeric:tabular-nums}
.fin-row.tot{background:var(--bg);border-radius:10px;padding:10px;margin-top:4px;border:0}.fin-row.tot b{font-size:14px}
.fin-pos{color:var(--ok)}.fin-neg{color:var(--bad)}
.fin-note{background:var(--blue-l);border:1px solid #CFE0EE;border-radius:10px;padding:11px 12px;font-size:12px;line-height:1.6;color:#334155;margin-bottom:12px}.fin-note b{color:var(--navy)}
.cv{width:100%;display:block}
.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--mut)}.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.dn{display:flex;align-items:center;gap:14px}.dn svg{width:132px;flex:none}.dn .lgd{flex-direction:column;margin:0;flex:1}.dn .lgd span{display:flex;justify-content:space-between;gap:6px}
.hb{margin:8px 0}.hb .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}.hb .l b{color:var(--navy)}
.hb .bg{height:8px;background:#E2E8F0;border-radius:8px;overflow:hidden}.hb .bg i{display:block;height:100%;border-radius:8px;background:var(--blue)}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:8;border-radius:999px;padding:13px 20px;box-shadow:0 4px 14px rgba(20,43,69,.25)}

/* ---------- Navigasi bawah (HP & tablet) ---------- */
nav{position:fixed;left:0;right:0;bottom:0;width:100%;background:#fff;border-top:1px solid var(--line);display:flex;z-index:9;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;border:0;background:none;padding:6px 2px;font-size:11px;color:var(--mut);cursor:pointer;border-radius:10px;font-weight:600;transition:color .15s,background .15s;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button i{display:flex;font-style:normal;height:22px;align-items:center}
nav button.on{color:var(--blue);background:var(--blue-l)}

/* ---------- Drawer menu (HP) & sidebar (desktop) ---------- */
#drw{position:fixed;inset:0;background:rgba(20,43,69,.5);z-index:30;display:none;animation:fd .2s}
#drw>div{position:absolute;top:0;bottom:0;left:0;width:84%;max-width:320px;background:#fff;padding:16px 12px calc(20px + env(safe-area-inset-bottom,0px));animation:sd .25s cubic-bezier(.2,.8,.2,1);overflow:auto}
@keyframes sd{from{transform:translateX(-100%)}to{transform:none}}@keyframes fd{from{opacity:0}to{opacity:1}}
.dtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}.dtop b{flex:1;font-size:15px;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtop img{border-radius:8px!important;box-shadow:none!important}
.dx{border:1px solid var(--line);background:#fff;color:var(--mut);width:34px;height:34px;border-radius:var(--r-s);font-size:15px;cursor:pointer}
.dprof{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);color:var(--t);border-radius:var(--r);padding:12px;margin-bottom:12px}
.dprof .av{background:var(--navy);color:#fff;border:0;width:42px;height:42px}
.dprof small{color:var(--mut);font-size:12px;display:block}.dprof b{font-size:14px;display:block;color:var(--navy)}
.dprof .rl{display:inline-block;margin-top:4px;background:var(--blue-l);color:var(--blue);padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.dclock{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}.dclock b{font-size:14px;color:var(--navy);font-variant-numeric:tabular-nums}
.dlb,.sb-lb{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--mut);margin:4px 8px 6px}
.mg{margin-bottom:2px}
.mi{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--t);font-size:14px;font-weight:600;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .15s,color .15s}
.mi i{display:flex;width:22px;height:22px;flex:none;align-items:center;justify-content:center;font-style:normal;color:var(--mut)}
.mi i svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi:hover{background:var(--bg)}
.mi.on{background:var(--blue-l);color:var(--blue)}.mi.on i{color:var(--blue)}
.mi.grp:after{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg);margin:0 4px 3px 0;opacity:.55;transition:transform .2s}
.mg.open>.mi.grp:after{transform:rotate(-135deg);margin-bottom:-3px}
.mg.has>.mi.grp{color:var(--blue)}.mg.has>.mi.grp i{color:var(--blue)}
.ms{display:none;margin:2px 0 4px 21px;padding-left:10px;border-left:1px solid var(--line)}
.mg.open>.ms{display:block}
.ms .mi{font-size:13.5px;font-weight:500;padding:8px 10px}
.mi.out{color:var(--bad);margin-top:6px}.mi.out i{color:var(--bad)}.mi.out:hover{background:var(--bad-l)}
.dfoot{text-align:center;font-size:11px;color:var(--mut);margin-top:14px}
#sb{display:none}

/* ---------- Modal, toast, loading ---------- */
#mod{display:none;position:fixed;inset:0;background:rgba(20,43,69,.5);z-index:40;align-items:center;justify-content:center;padding:14px}
#mod>div{background:#fff;border-radius:var(--r);padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto;animation:fi .18s;border:1px solid var(--line)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;z-index:60;display:none;max-width:90%;font-size:13px;box-shadow:0 6px 20px rgba(20,43,69,.3)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--blue);z-index:70;transition:width .3s;opacity:0}
#ld{display:none;position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:50;align-items:center;justify-content:center}
.sp{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blue);animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Notifikasi ---------- */
.nbell{position:relative;display:inline-flex;align-items:center;justify-content:center}
.nbadge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center;pointer-events:none;box-shadow:0 0 0 2px var(--navy)}
.nbadge[hidden]{display:none}
#ntp{position:fixed;inset:0;z-index:45;background:rgba(20,43,69,.3)}
.ntp-box{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));right:8px;width:min(400px,calc(100vw - 16px));max-height:calc(100dvh - 80px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 36px rgba(20,43,69,.2);overflow:hidden;animation:fi .18s}
.ntp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line);flex:none}
.ntp-top>b{font-size:15px;color:var(--navy)}.ntp-act{display:flex;gap:6px;align-items:center}
.ntp-list{overflow:auto;padding:8px 10px 10px;-webkit-overflow-scrolling:touch}

/* ---------- Login ---------- */
.lg{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--bg);color:var(--t)}

.lg h1{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.4px}
.lg .sub{font-size:14px;color:var(--mut);margin:6px 0 20px}
.lg .box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 18px 16px;text-align:left;box-shadow:var(--sh)}

.lg .inp svg{width:20px;height:20px;flex:none;fill:var(--mut)}

.lg .eye{background:none;border:0;padding:4px;cursor:pointer;display:flex}.lg .eye svg{fill:var(--mut)}
.lg .opt{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px;font-size:13px;gap:8px;flex-wrap:wrap}
.lg .rm{display:flex;align-items:center;gap:9px;font-weight:500;cursor:pointer;font-size:13px}

.lg .rm input:checked+.cb{background:var(--blue);border-color:var(--blue)}
.lg .rm input:checked+.cb:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.lg .opt a{color:var(--blue);font-weight:600;cursor:pointer}.lg .opt a:hover{text-decoration:underline}
.lg .mbtn{width:100%;height:48px;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--blue);transition:background .15s}
.lg .mbtn:hover{background:var(--blue-d)}
.lg .mbtn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lg .foot{margin-top:16px;text-align:center;color:var(--mut)}
.lg .foot span{display:block;font-size:13px;font-weight:700;color:var(--navy)}
.lg .foot small{display:block;margin-top:2px;font-size:12px;color:var(--mut)}

/* ---------- Area pembeli / katalog ---------- */

.buyer-chip{border:1px solid var(--line);background:#fff;color:var(--t);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.15s}

/* ---------- Banner & APK ---------- */
.nb-bn{position:relative;margin:0 0 14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:16/6;min-height:140px;max-height:300px;background:var(--navy)}

/* ---------- RUMUS KEUANGAN (satu sumber untuk semua halaman) ----------

 l.forEach(s=>{const k=String(s.sale_date).slice(0,monthly?7:10),e=tr.find(a=>a[0]==k);if(e){e[2]+=+s.final_total;e[3]+=profit(s)}});

const stokMatch=(u,f)=>f==='ALL'||(f==='TERSEDIA'?u.current_status!=='TERJUAL':u.current_status===f);
const dOf=v=>String(v||'').slice(0,10);
const inRange=(v,a,b)=>{const k=dOf(v);if(!a&&!b)return true;if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return false;const f=a||b,t=b||a,lo=f<t?f:t,hi=f<t?t:f;return k>=lo&&k<=hi};
const soldMap=()=>{const m={};(S.d.sales||[]).forEach(x=>{if(x.sale_status==='BATAL'||x.sale_status==='REFUND')return;const k=String(x.unit_id);if(!m[k]||String(x.sale_date)>String(m[k].sale_date))m[k]=x});return m};
const filt=()=>{const q=S.q.toLowerCase().trim(),sold=S.f==='TERJUAL',sm=sold?soldMap():null,a=S.sf||'',b=S.st||'';return S.d.units.filter(u=>{if(!stokMatch(u,S.f)||(q&&!(u.brand+' '+u.model+' '+u.imei1+' '+(u.imei2||'')+' '+u.color).toLowerCase().includes(q)))return false;if(sold&&(a||b)){const x=sm[String(u.unit_id)];return !!x&&inRange(x.sale_date,a,b)}return true})};
const stokList=l=>{const sm=S.f==='TERJUAL'||S.f==='ALL'?soldMap():{},lim=S.lim||60,tot=l.length,more=tot>lim?`<button class="btn l w" style="margin-top:8px" onclick="S.lim=(S.lim||60)+60;list()">Tampilkan lebih banyak (${tot-lim} lagi)</button>`:'';return l.slice(0,lim).map(u=>{const p=PR(u.unit_id),s=u.current_status,b=[],sx=s==='TERJUAL'?sm[String(u.unit_id)]:null;
 if(['HP_MASUK','QC_GAGAL'].includes(s))b.push(`<button class="btn" onclick="svNew('${u.unit_id}')">Servis</button>`);
 if(s=='DALAM_SERVIS')b.push(`<button class="btn" onclick="nav('servis')">Servis</button>`);

const katCards=()=>{
 const q=String(S.kq||'').toLowerCase().trim();
 const wa=String(inf().store_phone||'').replace(/\D/g,'').replace(/^0/,'62');
 if(S.cat===undefined||S.cat===null)return '<div class="buyer-grid"><div class="buyer-empty"><b>Memuat katalog…</b>Sebentar ya, kami sedang mengambil data HP.</div></div>';
 let list=S.cat.filter(x=>`${x.brand||''} ${x.model||''} ${x.color||''} ${x.ram||''} ${x.rom||''}`.toLowerCase().includes(q));
 if(S.kbrand&&S.kbrand!=='SEMUA')list=list.filter(x=>String(x.brand||'').trim()===S.kbrand);
 if(S.ksort==='harga-naik')list.sort((a,b)=>(+a.price||0)-(+b.price||0));
 else if(S.ksort==='harga-turun')list.sort((a,b)=>(+b.price||0)-(+a.price||0));

/* Definisi: Harga jual bersih = harga jual - diskon. Biaya total = modal + biaya tetap + (biaya % x harga bersih).
   Laba = harga bersih - biaya total. Margin = laba / harga jual bersih. Markup = laba / biaya total. */
const kalkCalc=({modal=0,extra=0,pct=0,price=0,disc=0})=>{
 const fixed=modal+extra,r=pct/100,net=Math.max(price-disc,0),cost=fixed+net*r,laba=net-cost;
 return{fixed,net,cost,laba,margin:net>0?laba/net*100:null,markup:cost>0?laba/cost*100:null,
  breakNet:r<1?fixed/(1-r):null,
  minNet:tm=>{const d=1-r-tm/100;return d>1e-9?fixed/d:null}}};
const kRp=v=>{v=String(v||'').replace(/[^\d]/g,'');return v?Math.min(+v,1e12):0};
const kPc=v=>{v=parseFloat(String(v||'').replace(',','.'));return isFinite(v)&&v>0?Math.min(v,99):0};
const kFmt=v=>v===null||v===undefined||!isFinite(v)?'-':(Math.round(v*10)/10).toLocaleString('id-ID')+'%';
const kalkPick=id=>{if(!id)return;const p=PR(id);$('#kc_modal').value=costOf(id)||'';$('#kc_price').value=+p.selling_price||'';$('#kc_disc').value=+p.discount||'';kalkHit()};
function kalkHit(){const g=i=>($('#'+i)||{}).value,o=$('#kc_out');if(!o)return;
 const p={modal:kRp(g('kc_modal')),extra:kRp(g('kc_extra')),pct:kPc(g('kc_pct')),price:kRp(g('kc_price')),disc:kRp(g('kc_disc'))},tm=kPc(g('kc_tm')),c=kalkCalc(p);
 const cl=v=>v<0?'color:#DC2626':'color:#16A34A';
 const minN=c.minNet(tm),warn=p.disc>p.price?'<div class="empty" style="color:#DC2626">Diskon melebihi harga jual.</div>':'';
 o.innerHTML=`${warn}<div class="card"><b>Hasil</b>
 <div class="sw"><span>Harga jual bersih (setelah diskon)</span><b>${rp(c.net)}</b></div>
 <div class="sw"><span>Biaya total (modal + biaya)</span><b>${rp(c.cost)}</b></div>
 <div class="sw"><span>Laba</span><b style="${cl(c.laba)}">${rp(c.laba)}</b></div>
 <div class="sw"><span>Margin (atas harga jual)</span><b style="${cl(c.laba)}">${kFmt(c.margin)}</b></div>
 <div class="sw"><span>Markup (atas biaya)</span><b style="${cl(c.laba)}">${kFmt(c.markup)}</b></div>
 <div class="sw"><span>Harga impas (tanpa untung/rugi)</span><b>${c.breakNet===null?'-':rp(Math.ceil(c.breakNet)+p.disc)}</b></div>
 <div class="sw"><span>Harga minimum untuk margin ${kFmt(tm)}</span><b>${minN===null?'Tidak tercapai':rp(Math.ceil(minN)+p.disc)}</b></div>
 <small>Harga impas & minimum dihitung sebagai harga jual sebelum diskon, dengan diskon yang sama seperti di atas.</small></div>`;
 const list=String(g('kc_sim')||'').split(/[\n,;]+/).map(x=>kRp(x)).filter(x=>x>0).slice(0,30),so=$('#kc_simout');
 so.innerHTML=list.length?`<div class="lst">${list.map(x=>{const k=kalkCalc(Object.assign({},p,{price:x}));return `<div class="lrow"><div><b>${rp(x)}</b><small>Bersih ${rp(k.net)}</small></div><div style="text-align:right;${cl(k.laba)}"><b>${rp(k.laba)}</b><small style="${cl(k.laba)}">Margin ${kFmt(k.margin)}</small></div></div>`}).join('')}</div>`:'<small>Masukkan beberapa harga jual (pisahkan koma atau baris baru) untuk dibandingkan.</small>'}
const kalkView=()=>{const us=(S.d.units||[]).filter(u=>u.current_status!=='TERJUAL');setTimeout(kalkHit,0);
 const I=(id,l,ph,mode)=>`<label>${l}</label><input id="${id}" inputmode="${mode||'numeric'}" placeholder="${ph||''}" oninput="kalkHit()">`;
 return hd('Kalkulator Harga Jual','dash')+`<div class="pg"><div class="card"><b>Modal & biaya</b><small>Hanya untuk simulasi — tidak mengubah harga unit atau transaksi.</small>
 <label>Ambil modal & harga dari unit (opsional)</label><select id="kc_unit" onchange="kalkPick(this.value)"><option value="">— Isi manual —</option>${us.map(u=>`<option value="${esc(u.unit_id)}">${esc(u.brand)} ${esc(u.model)} · ${esc(ST[u.current_status]?ST[u.current_status][0]:u.current_status)}</option>`).join('')}</select>
 ${I('kc_modal','Modal / HPP unit (Rp)','0')}${I('kc_extra','Biaya tambahan tetap (Rp): packing, ongkir, komisi','0')}${I('kc_pct','Biaya variabel (% dari harga jual): fee platform / EDC','0','decimal')}</div>

})();
/* Sinkronisasi lintas perangkat: ambil data terbaru berkala tanpa login ulang.
   Perubahan muncul biasanya dalam 10–15 detik. */
let syncBusy=false, lastSyncSignature='';
async function syncConnectedDevices(){
  if(!S.t || !S.u || document.hidden || syncBusy || busyN>0) return;
  syncBusy=true;
  try{
    const fresh=await api('refresh',S.t,(S.d&&S.d.__v)||'');
    if(fresh&&fresh.same)return;if(fresh&&fresh.__v&&S.d&&fresh.__v===S.d.__v)return;
    const sig=JSON.stringify(fresh);
    if(sig!==lastSyncSignature && sig!==JSON.stringify(S.d)){
      const modalOpen=$('#mod').style.display==='flex';
      const active=document.activeElement;
      const editing=active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
      // Jangan menggambar ulang layar yang sedang mengandung isian atau alur transaksi.
      const LOCK_PAGES = ['form','qc','qris','spesifikasi','kalk'];
      if(!modalOpen && !editing && !LOCK_PAGES.includes(S.p)){ S.d=fresh; render(); }
      else { S.d=fresh; } // Data segar masuk memori, tetapi DOM/form yang sedang dikerjakan tetap utuh.
    }
    lastSyncSignature=sig;
  }catch(e){
    const m=String(e&&e.message||e);
    if(m.indexOf('SESI_HABIS')>=0){
      // Polling memperpanjang sesi selama perangkat tetap tersambung dan aktif.
      S.u=S.t=S.d=null; try{localStorage.removeItem('sk_token');localStorage.removeItem('sk_token_exp')}catch(err){} S.p='login'; render(); toast('Sesi berakhir. Silakan masuk kembali.');
    } else { toast('Koneksi terputus sementara. Data akan dicoba lagi otomatis.'); }
  }finally{syncBusy=false;}
}
setInterval(()=>{if(!document.hidden)syncConnectedDevices()},30000);

 function b64(buf){var b='',u=new Uint8Array(buf),C=0x8000;for(var i=0;i<u.length;i+=C)b+=String.fromCharCode.apply(null,u.subarray(i,i+C));return btoa(b)}
 window.nbApkPick=async function(el){

<script id="update2-favicon">
/* Ikon tab browser mengikuti Logo Toko (Pengaturan). Tanpa logo: memakai ikon bawaan. */
(function(){
 var cur='';
 function ensure(rel){var l=document.querySelector('link[rel="'+rel+'"]');if(!l){l=document.createElement('link');l.rel=rel;document.head.appendChild(l)}return l}
 function apply(u){if(u===cur)return;cur=u;var f=ensure('icon'),a=ensure('apple-touch-icon');f.removeAttribute('type');f.href=u;a.href=u}
 function sync(){
  try{
   var u=(S.d&&S.d.settings&&S.d.settings.store_logo_url)||(S.pub&&S.pub.store_logo_url)||'';
   if(!u){apply(ICON);return}
   if(u===cur)return;
   var im=new Image();im.onload=function(){apply(u)};im.onerror=function(){apply(ICON)};im.src=u;
  }catch(e){}
 }
 apply(ICON);sync();setInterval(sync,2000);
})();
</script>

<script id="pdp">

 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',

const pdpScroll=el=>{const i=Math.round(el.scrollLeft/Math.max(el.clientWidth,1)),c=el.parentNode.querySelector('.pdp-ct');if(c)c.textContent=(i+1)+'/'+el.children.length;el.parentNode.querySelectorAll('.pdp-th button').forEach((b,j)=>b.classList.toggle('on',j===i))};
const pdpGo=(b,i)=>{const sl=b.closest('.pdp-gal').querySelector('.pdp-sl');sl.scrollTo({left:i*sl.clientWidth,behavior:'smooth'})};
const pdpMore=b=>{const d=b.previousElementSibling;const o=d.classList.toggle('cl');b.textContent=o?'Lihat selengkapnya':'Sembunyikan'};

 return `<div class="pdp-gal"><div class="pdp-sl" onscroll="pdpScroll(this)">${ph.length?ph.map(u=>`<div><img src="${esc(u)}" alt="" referrerpolicy="no-referrer" onclick="viewPhoto(this.src)" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph0'}))"></div>`).join(''):'<div><span class="ph0"></span></div>'}</div>${ph.length?`<span class="pdp-ct">1/${ph.length}</span>`:''}${ph.length>1?`<div class="pdp-th">${ph.map((u,i)=>`<button type="button" class="${i?'':'on'}" onclick="pdpGo(this,${i})" aria-label="Foto ${i+1}"><img src="${esc(u)}" alt="" referrerpolicy="no-referrer"></button>`).join('')}</div>`:''}</div>`};

const pdpDesc=t=>{const x=String(t||'').trim();if(!x)return '<p class="mp-em">Penjual belum menulis deskripsi.</p>';const long=x.length>260||x.split('\n').length>6;return `<div class="pdp-dt${long?' cl':''}">${esc(x)}</div>${long?'<button type="button" class="pdp-more" onclick="pdpMore(this)">Lihat selengkapnya</button>':''}`};

/* ---- produk toko mitra ---- */
P.mpprod=()=>{
 const p=M.det;if(!p)return `<div class="pdp">${pdpTop()}<div class="pdp-s">Produk tidak ditemukan.<br><button class="btn g" style="margin-top:12px" onclick="nav('intro')">Kembali ke beranda</button></div></div>`;
 M.reg[p.prod_id]=p;

<script id="lockzoom">
/* iOS Safari mengabaikan user-scalable=no, jadi gestur zoom diblokir manual (hanya di layar sentuh) */
(function(){
 if(!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))return;
 ['gesturestart','gesturechange','gestureend'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()},{passive:false})});
 document.addEventListener('touchmove',function(ev){if(ev.touches&&ev.touches.length>1)ev.preventDefault()},{passive:false});
 var t=0;document.addEventListener('touchend',function(ev){var n=Date.now();if(n-t<300)ev.preventDefault();t=n},{passive:false});
})();
</script>
